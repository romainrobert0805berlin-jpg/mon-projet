name: Deploy app to GitHub Pages

on:
  push:
    branches: [claude/dreamy-cray-k1mt5f]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Application (Vite + shadcn) -> racine /mon-projet/
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app

      # Assemble : app a la racine + variations de design sous /v1../v5/ et /variations/
      - name: Assemble site
        run: |
          rm -rf _site && mkdir _site
          cp -r app/dist/. _site/
          cp -r variations/. _site/variations/
          for v in v1 v2 v3 v4 v5; do
            mkdir -p "_site/$v"
            cp -r "variations/$v/." "_site/$v/"
          done

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
