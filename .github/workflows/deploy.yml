name: Deploy app to GitHub Pages

on:
  push:
    branches: [claude/dreamy-cray-k1mt5f]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Site SEO (Astro) -> racine
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site

      # App (Vite + shadcn) -> /app/
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app

      # Combinaison : site a la racine, app sous /app/
      - name: Combine outputs
        run: |
          rm -rf _site
          mkdir -p _site
          cp -r site/dist/. _site/
          mkdir -p _site/app
          cp -r app/dist/. _site/app/

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
